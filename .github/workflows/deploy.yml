name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job 1: Deploy via GitHub Actions environment (works when Source = GitHub Actions)
  deploy-actions:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true   # Don't fail the whole workflow if pages not configured

  # Job 2: Also push to gh-pages branch directly (works when Source = Deploy from branch)
  deploy-ghpages:
    runs-on: ubuntu-latest
    needs: []   # Run independently, not waiting for deploy-actions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          exclude_assets: '.github,*.md,.kiro,.vscode,.git'
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
